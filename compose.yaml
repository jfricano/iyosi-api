name: iyosi

services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iyosi}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-iyosi}
      IYOSI_SECRET: ${IYOSI_SECRET:?Set IYOSI_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sh scripts/start_api.sh
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iyosi}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-iyosi}
      IYOSI_SECRET: ${IYOSI_SECRET:?Set IYOSI_SECRET in .env}
      GEOCODER_URL: ${GEOCODER_URL:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: infra/db/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iyosi}
      POSTGRES_USER: ${POSTGRES_USER:-iyosi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iyosi} -d ${POSTGRES_DB:-iyosi}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
