name: Backend

on:
  push:
  pull_request:

jobs:
  contract-and-postgis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IYOSI_SECRET: ci-only-test-secret-012345678901234567890123456789
      POSTGRES_PASSWORD: ci-only-password
      IYOSI_APP_DB_PASSWORD: ci-only-runtime-password
      IYOSI_EDGE_NETWORK: edge-iyosi
      IYOSI_TRUSTED_PROXY_IPS: 10.203.41.2
      IYOSI_API_IMAGE: iyosi-api:ci
      IYOSI_DB_IMAGE: iyosi-postgis:ci
      COMPOSE_PROJECT_NAME: iyosi_ci
    steps:
      - uses: actions/checkout@v4
      - name: Validate shared-host isolation contract
        run: |
          docker compose -f compose.shared.yaml config --format json > /tmp/iyosi-shared-config.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('/tmp/iyosi-shared-config.json').read_text())
          services = config['services']
          assert all('build' not in service for service in services.values())
          assert all('ports' not in service for service in services.values())
          assert set(services['api']['networks']) == {'data', 'edge'}
          assert set(services['db']['networks']) == {'data'}
          assert set(services['migrate']['networks']) == {'data'}
          assert config['networks']['data']['internal'] is True
          assert config['networks']['edge']['name'] == 'edge-iyosi'
          assert services['api']['environment']['IYOSI_TRUSTED_PROXY_IPS'] == '10.203.41.2'
          PY
          docker compose -f compose.shared.yaml -f compose.shared.build.yaml config --quiet
      - name: Build test and PostGIS images
        run: docker compose build workspace db
      - name: Start PostGIS
        run: docker compose up -d --wait db
      - name: Create marked, dedicated integration database
        run: |
          docker compose exec -T db sh -ec 'createdb -U "$POSTGRES_USER" iyosi_test'
          docker compose exec -T db sh -ec 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d iyosi_test' <<'SQL'
          CREATE TABLE iyosi_integration_test_guard (purpose text PRIMARY KEY);
          INSERT INTO iyosi_integration_test_guard VALUES ('iyosi dedicated integration tests');
          SQL
      - name: Contract and PostGIS tests
        run: |
          docker compose run --rm -T \
            -e TEST_DATABASE_URL=postgresql://iyosi:ci-only-password@db:5432/iyosi_test \
            workspace sh -ec 'PYTHONPATH=. python -m pytest -q tests'
      - name: Admin console JavaScript checks
        run: |
          node --check admin/assets/admin.js
          node tests/test_admin_ui.js
      - name: Verify checked-in OpenAPI
        run: |
          docker compose run --rm -T workspace sh -ec 'PYTHONPATH=. python scripts/export_openapi.py'
          git diff --exit-code -- docs/openapi.json
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100 db
      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans
