# Shared-host pilot contract. A separate ingress project owns HTTPS and the edge network.
name: iyosi_shared

x-api-image: &api_image
  image: ${IYOSI_API_IMAGE:-iyosi-api:local}
  build:
    context: .
    dockerfile: infra/api/Dockerfile

services:
  db:
    image: ${IYOSI_DB_IMAGE:-iyosi-postgis:local}
    build:
      context: .
      dockerfile: infra/db/Dockerfile
    restart: unless-stopped
    networks: [data]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iyosi}
      POSTGRES_USER: ${POSTGRES_USER:-iyosi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a migration database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    cpus: 0.5
    mem_limit: 1536m
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iyosi} -d ${POSTGRES_DB:-iyosi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *api_image
    command: ["sh", "scripts/prepare_db.sh"]
    restart: "no"
    read_only: true
    tmpfs: /tmp
    security_opt: ["no-new-privileges:true"]
    networks: [data]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iyosi}:${POSTGRES_PASSWORD:?Set a migration database password}@db:5432/${POSTGRES_DB:-iyosi}
      IYOSI_APP_DB_USER: ${IYOSI_APP_DB_USER:-iyosi_app}
      IYOSI_APP_DB_PASSWORD: ${IYOSI_APP_DB_PASSWORD:?Set a runtime database password}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api_image
    command: ["sh", "scripts/serve_api.sh"]
    restart: unless-stopped
    read_only: true
    tmpfs: /tmp
    security_opt: ["no-new-privileges:true"]
    networks:
      data:
      edge:
        aliases: [iyosi-api]
    environment:
      DATABASE_URL: postgresql://${IYOSI_APP_DB_USER:-iyosi_app}:${IYOSI_APP_DB_PASSWORD:?Set a runtime database password}@db:5432/${POSTGRES_DB:-iyosi}
      IYOSI_SECRET: ${IYOSI_SECRET:?Set a token signing secret}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GEOCODER_URL: ${GEOCODER_URL:-}
      IYOSI_TRUSTED_PROXY_IPS: ${IYOSI_TRUSTED_PROXY_IPS:?Set the exact ingress proxy address}
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

networks:
  data:
    internal: true
  edge:
    external: true
    name: ${IYOSI_EDGE_NETWORK:?Set the shared ingress network name}

volumes:
  postgres_data:
