# Single-host private-pilot template. Terminate HTTPS in a host-managed reverse proxy.
name: iyosi_pilot

services:
  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iyosi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-iyosi}
      IYOSI_SECRET: ${IYOSI_SECRET:?Set IYOSI_SECRET}
      GEOCODER_URL: ${GEOCODER_URL:-}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  db:
    build:
      context: .
      dockerfile: infra/db/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iyosi}
      POSTGRES_USER: ${POSTGRES_USER:-iyosi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iyosi} -d ${POSTGRES_DB:-iyosi}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
